[package]
name = "backend_backend"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib"]

[dependencies]
candid = "0.10"
hex = "0.4.3"
ic-cdk = "0.16"
ic-cdk-macros = "0.16.0"
ic-cdk-timers = "0.10" # Feel free to remove this dependency if you don't need timers
ic-stable-structures = "0.6.5"
icrc-ledger-client-cdk = { git = "https://github.com/dfinity/ic", version = "0.1.2" }
icrc-ledger-types = { git = "https://github.com/dfinity/ic", version = "0.1.9" }
num-bigint = "0.4.6"
serde = "1.0.219"
sha2 = "0.10.9"
ark-std = "0.4"
ark-relations = "0.4"
ark-groth16 = "0.3"
ark-bn254 = "0.4"
ark-serialize = "0.4"
ark-ec = "0.4"
ark-snark = "0.4"
ark-ff = "0.4"
num-traits = "0.2"

[dev-dependencies]
assert_matches = "1.5"
